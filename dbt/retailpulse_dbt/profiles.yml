retailpulse:
  target: dev
  outputs:
    dev:
      type: bigquery
      method: service-account
      project: "{{ env_var('GCP_PROJECT_ID', 'retailpulse-production') }}"
      dataset: "{{ env_var('BIGQUERY_STAGING_DATASET', 'retailpulse_staging') }}"
      location: "{{ env_var('GCP_REGION', 'asia-south1') }}"
      keyfile: "{{ env_var('GOOGLE_APPLICATION_CREDENTIALS', '') }}"
      threads: 4
      timeout_seconds: 300
      priority: interactive

