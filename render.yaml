services:
  - type: web
    name: retailpulse-api
    env: python
    region: singapore
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: uvicorn retailpulse.api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: USE_SQLITE
        value: "true"
      - key: PYTHONUNBUFFERED
        value: "1"
    healthCheckPath: /health

