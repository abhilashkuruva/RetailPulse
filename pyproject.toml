[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "retailpulse"
version = "0.1.0"
description = "A beginner-friendly GCP e-commerce data engineering pipeline"
requires-python = ">=3.11"
dependencies = [
  "pydantic-settings>=2.2,<3",
  "mysql-connector-python>=8.3,<10",
  "google-cloud-storage>=2.16,<4",
  "google-cloud-bigquery>=3.20,<4",
]

[project.optional-dependencies]
dev = ["pytest>=8,<9", "ruff>=0.6,<1"]
airflow = ["apache-airflow>=2.9,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
per-file-ignores = {"airflow/dags/*.py" = ["E501"]}
