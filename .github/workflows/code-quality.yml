name: Code Quality & Linting

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install linting dependencies
        run: |
          python -m pip install --upgrade pip
          pip install ruff>=0.6

      - name: Run Ruff linter (PEP8, import order, type hints)
        run: |
          python -m ruff check src tests --output-format=github

      - name: Verify no secrets in tracked files
        run: |
          if git grep -E -I "(-----BEGIN (RSA |EC )?PRIVATE KEY-----|ghp_[A-Za-z0-9]{30,}|sk-[A-Za-z0-9]{20,})" -- src/ tests/ config/; then
            echo "ERROR: Potential secret detected in tracked files!"
            exit 1
          fi
          echo "No secrets detected in source files."
